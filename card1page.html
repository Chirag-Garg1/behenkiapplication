<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIPPM - Card 1 Page</title>
    <style>
      body {
        background: url("images/card1pagebg.jpg") no-repeat center center fixed;
        background-size: cover;
        color: #fff;
        font-family: "Montserrat", sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      .container {
        max-width: 500px;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      h1 {
        color: #fff;
        margin-bottom: 16px;
      }
      p {
        color: #e0d7f7;
        font-size: 1.1rem;
      }
      a {
        color: #fff;
        text-decoration: underline;
      }
      .back-btn {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 24px;
        background: #fff;
        color: #490d99;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.2s, color 0.2s;
      }
      .back-btn:hover {
        background: #e0d7f7;
        color: #2c1c75;
      }
      .hero-flex {
        position: absolute;
        top: 84px;
        left: 52px;
        display: flex;
        align-items: flex-start;
      }
      .hero-heading {
        font-family: "Montserrat", sans-serif;
        font-weight: bold;
        color: #fff;
        font-size: 5rem;
        line-height: 0.95;
        letter-spacing: 1px;
        margin-right: 32px;
        filter: drop-shadow(0 0 40px #000) drop-shadow(0 0 80px #000);
      }
      .brain-img {
        height: 32.5rem;
        width: auto;
        margin-top: 10px;
        filter: drop-shadow(0 0 40px #000) drop-shadow(0 0 80px #000);
      }
    </style>
  </head>
  <body>
    <div class="hero-flex">
      <div class="hero-heading">Diplomind <br />Evolve</div>
      <img src="images/brain1.png" alt="Brain" class="brain-img" />
    </div>
  </body>
</html>
