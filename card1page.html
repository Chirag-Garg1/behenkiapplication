<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIPPM - Card 1 Page</title>
    <style>
      body {
        background: linear-gradient(
          to bottom,
          #7a2ff7 0%,
          #4a0d99 60%,
          #1a0033 100%
        );
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #fff;
        font-family: "Montserrat", sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      .container {
        max-width: 500px;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      h1 {
        color: #fff;
        margin-bottom: 16px;
      }
      p {
        color: #e0d7f7;
        font-size: 1.1rem;
      }
      a {
        color: #fff;
        text-decoration: underline;
      }
      .back-btn {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 24px;
        background: #fff;
        color: #490d99;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.2s, color 0.2s;
      }
      .back-btn:hover {
        background: #e0d7f7;
        color: #2c1c75;
      }
    </style>
  </head>
  <body>
    <div
      style="
        position: absolute;
        top: 84px;
        left: 52px;
        display: flex;
        align-items: flex-start;
      "
    >
      <div
        style="
          font-family: 'Montserrat', sans-serif;
          font-weight: bold;
          color: #fff;
          font-size: 5rem;
          line-height: 0.95;
          letter-spacing: 1px;

          margin-right: 32px;
        "
      >
        Diplomind <br />Evolve
      </div>
      <img
        src="images/brain.png"
        alt="Brain"
        style="
          height: 32.5rem;
          width: auto;
          margin-top: 10px;
          margin-left: -250px;
        "
      />
    </div>
  </body>
</html>
