<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diplomind Evolve</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom, #0d0221, #1b003a);
      color: #fff;
      font-family: "Montserrat", sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 800px;
      width: 100%;
    }

    .hero-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .hero-text {
      flex: 1 1 300px;
      text-align: left;
    }

    .hero-heading {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .hero-subtext {
      font-size: 1.2rem;
      color: #d5d1e5;
      margin-bottom: 24px;
    }

    .start-btn {
      background: #a463ff;
      color: #fff;
      padding: 12px 24px;
      border-radius: 32px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .start-btn:hover {
      background: #944fff;
    }

    .brain-img {
      flex: 1 1 300px;
      max-width: 320px;
      width: 100%;
      margin-top: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      padding: 20px;
      border-radius: 20px;
      margin-top: 40px;
      backdrop-filter: blur(10px);
    }

    .tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 12px;
      background: #340066;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
    }

    .tab.active {
      background: #a463ff;
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: bold;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .hero-flex {
        flex-direction: column;
        text-align: center;
      }

      .hero-text {
        text-align: center;
      }

      .hero-heading {
        font-size: 2.2rem;
      }

      .hero-subtext {
        font-size: 1rem;
      }

      .brain-img {
        margin-top: -120px;
        max-width: 300px;
      }
      .card {
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero-flex">
      <div class="hero-text">
        <div class="hero-heading">Diplomind Evolve</div>
        <div class="hero-subtext">
          The Confidence Section, a transformative program with 20-step to Confidence
        </div>
        <button class="start-btn">Start Now</button>
      </div>
      <img src="images/brain1.png" alt="Brain" class="brain-img" />
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab active">Public Speaking</div>
        <div class="tab">Leadership</div>
      </div>
      <div class="card-title">20-Step to Confidence</div>
    </div>
  </div>
</body>
</html>
