<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline with Slider Starting from Step 1</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.7) 0%,
            rgba(0, 0, 0, 0.95) 100%
          ),
          radial-gradient(
            circle,
            rgba(40, 20, 50, 1) 0%,
            rgba(76, 44, 92, 1) 20%,
            rgba(119, 0, 255, 0.7) 50%,
            rgba(0, 0, 0, 1) 100%
          );
        color: #ccc;
        font-family: "Montserrat", sans-serif;
      }

      .timeline-container {
        position: relative;
        width: 90%;
        max-width: 600px;
        margin: 50px auto;
        padding-left: 50px;
      }

      .timeline-line {
        position: absolute;
        left: 15px;
        top: 0;
        bottom: 0;
        width: 3px;
        background: #7b3fe4;
        box-shadow: 0 0 32px 8px #a463ff;
      }

      .slider-dot {
        position: absolute;
        left: 8px;
        width: 18px;
        height: 18px;
        background: #a463ff;
        border-radius: 50%;
        box-shadow: 0 0 32px 12px #a463ff;
        transition: top 0.2s ease-out;
        z-index: 10;
      }

      .timeline {
        position: relative;
        padding-left: 50px;
      }

      .step {
        position: relative;
        margin-bottom: 80px;
        opacity: 0;
        transform: translateY(30px);
        transition: 0.6s ease all;
      }

      .step.in-view {
        opacity: 1;
        transform: translateY(0);
      }

      .step-number {
        position: absolute;
        top: 0;
        left: -60px;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background-color: #111;
        border: 2px solid #7b3fe4;
        color: #ffd600;
        text-align: center;
        line-height: 40px;
        font-weight: bold;
        transition: 0.4s ease;
      }

      .step-number.glow {
        box-shadow: 0 0 15px 5px #a463ff;
      }

      .step-title {
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
        margin-bottom: 6px;
      }

      .step-description {
        font-size: 0.95rem;
        color: #aaa;
      }

      .highlight {
        color: #ffd600;
      }
    </style>
  </head>
  <body>
    <div class="timeline-container">
      <div class="timeline-line"></div>
      <div class="slider-dot" id="sliderDot"></div>

      <div class="timeline" id="timeline">
        <!-- Steps generated below -->
      </div>
    </div>

    <script>
      const timeline = document.getElementById("timeline");

      // Generate 20 steps dynamically
      for (let i = 1; i <= 20; i++) {
        const step = document.createElement("div");
        step.className = "step";
        step.innerHTML = `
        <div class="step-number">${String(i).padStart(2, "0")}</div>
        <div class="step-title"><span class="highlight">Step ${i}</span> Title Here</div>
        <div class="step-description">This is a sample description for step ${i}.</div>
      `;
        timeline.appendChild(step);
      }

      const sliderDot = document.getElementById("sliderDot");

      function updateSliderDot() {
        const steps = document.querySelectorAll(".step");
        let currentStepIndex = 0;

        steps.forEach((step, index) => {
          const rect = step.getBoundingClientRect();
          if (rect.top >= 0 && rect.top < window.innerHeight / 1.5) {
            currentStepIndex = index;
          }
        });

        // Remove glow from all step numbers
        steps.forEach((step, idx) => {
          const stepNum = step.querySelector(".step-number");
          if (idx === currentStepIndex) {
            stepNum.classList.add("glow");
          } else {
            stepNum.classList.remove("glow");
          }
        });

        // Optionally, handle in-view class for fade-in effect
        steps.forEach((step, idx) => {
          if (idx <= currentStepIndex) {
            step.classList.add("in-view");
          } else {
            step.classList.remove("in-view");
          }
        });

        const activeStep = steps[currentStepIndex];
        const containerTop = document
          .querySelector(".timeline-container")
          .getBoundingClientRect().top;
        const stepTop = activeStep.getBoundingClientRect().top;
        const offset = stepTop - containerTop + 10; // adjust as needed
        sliderDot.style.top = `${offset}px`;
      }

      // Ensure it starts on Step 1 even before scroll
      window.addEventListener("load", () => {
        const steps = document.querySelectorAll(".step");
        steps.forEach((step, idx) => {
          const stepNum = step.querySelector(".step-number");
          if (idx === 0) {
            step.classList.add("in-view");
            stepNum.classList.add("glow");
          } else {
            step.classList.remove("in-view");
            stepNum.classList.remove("glow");
          }
        });
        // Position slider-dot at first step
        const containerTop = document
          .querySelector(".timeline-container")
          .getBoundingClientRect().top;
        const stepTop = steps[0].getBoundingClientRect().top;
        const offset = stepTop - containerTop + 10;
        sliderDot.style.top = `${offset}px`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      window.addEventListener("scroll", updateSliderDot);
    </script>
  </body>
</html>
